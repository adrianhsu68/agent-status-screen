<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Status</title>
<!--
  Built for a tiny second screen (e.g. a 90 x 55 mm wireless display): 1vh is about 0.55 mm there,
  so the smallest text is 5.5vh (about 3 mm). Only things you read at a glance: clock, weather, agent state.
  Claude / OpenAI logo paths: simple-icons@13.21.0 (CC0 SVGs; the logos are trademarks of their owners).
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1119; --panel: #151e2b; --panel-2: #202c3e;
    --text: #f6f4ee; --muted: #9aa8bb; --dim: #5d6a7d;
    --ok: #6fdc9f; --warn: #ffb86b; --bad: #ff6b61; --info: #7cc0ff;
    --claude: #e8875b; --codex: #a5b4fc;
    --gap: 1.6vh;
    font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; cursor: none; }
  .num { font-family: "Segoe UI", "Bahnschrift", system-ui, sans-serif; font-variant-numeric: tabular-nums; }

  main { height: 100vh; padding: var(--gap); display: grid; gap: var(--gap);
         grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
         grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
         grid-template-areas: "clock claude" "wx codex"; }
  body.no-wx main { grid-template-areas: "clock claude" "clock codex"; }
  body.no-wx #wx { display: none; }
  .card { background: var(--panel); border-radius: 2.4vh; min-width: 0; min-height: 0; overflow: hidden; position: relative; }

  /* clock */
  #clockCard { grid-area: clock; display: flex; align-items: center; justify-content: center; padding: 0 3vh; }
  #clockBox { display: flex; flex-direction: column; max-width: 100%; }
  #clock { font-size: min(24vh, 13vw); font-weight: 700; line-height: .95; letter-spacing: -.02em; white-space: nowrap; }
  #clock .sec { font-size: .5em; font-weight: 600; color: var(--muted); }
  #sub { margin-top: .5vh; font-size: 7vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub.alarm { align-self: flex-start; color: #fff; background: var(--bad); border-radius: 1.2vh; padding: .1em .35em;
               font-weight: 700; animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 50% { background: #a3322b; } }

  /* weather */
  #wx { grid-area: wx; display: flex; flex-direction: column; justify-content: space-evenly; padding: 1.5vh 3vh; gap: 1vh; }
  #wxMain { display: flex; align-items: center; gap: 2vh; white-space: nowrap; }
  #wIcon { font-size: 13vh; line-height: 1; }
  #wTemp { font-size: 13vh; font-weight: 600; line-height: 1; }
  #wRain { margin-left: auto; font-size: 15vh; font-weight: 800; line-height: 1; color: var(--info); }
  #wRain small { font-size: .45em; }
  #wRain .drop { font-size: .5em; margin-right: .1em; }
  #rainAlert { font-size: 7vh; font-weight: 800; text-align: center; border-radius: 1.2vh; padding: .05em .3em;
               background: var(--info); color: #06121f; white-space: nowrap; overflow: hidden; }
  #rainAlert:empty { display: none; }
  #hours { display: flex; gap: 1vh; }
  #hours > div { flex: 1; text-align: center; background: var(--panel-2); border-radius: 1.2vh; padding: .4vh 0;
                 font-size: 5.5vh; line-height: 1.15; color: var(--muted); white-space: nowrap; }
  #hours b { display: block; font-size: 6.5vh; color: var(--text); }
  #hours .wet { background: color-mix(in srgb, var(--info) 30%, var(--panel-2)); }
  #hours .wet b { color: var(--info); }
  #hours:empty { display: none; }
  #rainAlert:not(:empty) + #hours { display: none; }   /* not enough room for both */

  /* Claude / Codex */
  .agent { display: flex; align-items: center; gap: 1.5vh; padding: 1vh 2.5vh 1vh 1vh;
           border-left: 1.4vh solid var(--accent); }
  #claude { grid-area: claude; --accent: var(--claude); }
  #codex { grid-area: codex; --accent: var(--codex); }
  .pet-box { height: 40vh; aspect-ratio: 192 / 208; position: relative; flex: none; margin: -1vh 0; }
  .pet { position: absolute; inset: 0; background-repeat: no-repeat; transition: filter .4s, opacity .4s; }
  .agent.off .pet { filter: grayscale(1) brightness(.7); opacity: .5; }
  .zz { position: absolute; right: 0; top: 0; font-size: 7vh; color: var(--muted); font-weight: 800;
        display: none; animation: float 3s ease-in-out infinite; }
  .agent.off .zz { display: block; }
  @keyframes float { 50% { transform: translateY(-20%); opacity: .5; } }
  .info { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2.6vh; }
  .name { display: flex; align-items: center; gap: .3em; font-size: 6vh; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .name svg { width: 1em; height: 1em; flex: none; color: var(--text); }
  .state { align-self: flex-start; font-size: 9.5vh; font-weight: 900; line-height: 1.2; padding: .02em .3em;
           border-radius: 1.2vh; white-space: nowrap; }
  html[lang=en] .state { font-size: 6.5vh; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }   /* English words are wider than 2-3 CJK characters */
  .s-run  .state { color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .s-wait .state { color: #1a1205; background: var(--warn); }
  .s-done .state { color: var(--info); background: color-mix(in srgb, var(--info) 16%, transparent); }
  .s-off  .state { color: var(--dim); background: var(--panel-2); }
  .act { font-size: 6vh; line-height: 1.25; color: var(--text); overflow: hidden; overflow-wrap: anywhere;
         display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .s-off .act, .s-done .act { color: var(--muted); }
  .agent.s-wait { animation: attention 1.2s ease-in-out infinite; }
  @keyframes attention { 50% { box-shadow: inset 0 0 0 1vh var(--warn); } }

  /* outside display_hours: all black and no DOM updates, so a wireless display only streams a still frame */
  body.sleep { background: #000; }
  body.sleep main, body.sleep #demo { visibility: hidden; }
  #demo { position: fixed; right: 1vh; bottom: .5vh; font-size: 3vh; color: var(--warn); }

  @media (orientation: portrait) {
    main { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr 1fr;
           grid-template-areas: "clock" "wx" "claude" "codex"; }
    body.no-wx main { grid-template-rows: auto 1fr 1fr; grid-template-areas: "clock" "claude" "codex"; }
    #clockCard { padding: 2vh 3vh; }
    #clock { font-size: 22vw; }
    #sub, .name, .act { font-size: 5vw; } .state { font-size: 8vw; } html[lang=en] .state { font-size: 6vw; } #rainAlert { font-size: 6vw; }
    #wIcon, #wTemp { font-size: 11vw; } #wRain { font-size: 13vw; }
    #hours > div { font-size: 4.5vw; } #hours b { font-size: 5.5vw; }
    .pet-box { height: 20vh; }
  }
</style>
<body>
<main>
  <section class="card" id="clockCard">
    <div id="clockBox">
      <div id="clock" class="num">--:--</div>
      <div id="sub">&nbsp;</div>
    </div>
  </section>

  <section class="card" id="wx">
    <div id="wxMain">
      <span id="wIcon"></span><span id="wTemp" class="num">—</span>
      <span id="wRain" class="num"></span>
    </div>
    <div id="rainAlert"></div>
    <div id="hours"></div>
  </section>

  <section class="card agent s-off off" id="claude">
    <div class="pet-box"><div class="pet"></div><div class="zz">z<small>z</small></div></div>
    <div class="info">
      <div class="name"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#D97757" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>Claude</div>
      <div class="state"></div>
      <div class="act"></div>
    </div>
  </section>

  <section class="card agent s-off off" id="codex">
    <div class="pet-box"><div class="pet"></div><div class="zz">z<small>z</small></div></div>
    <div class="info">
      <div class="name"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>Codex</div>
      <div class="state"></div>
      <div class="act"></div>
    </div>
  </section>
</main>
<div id="demo"></div>
<script>
  const SPRITE = __SPRITE__;
  const POSES = __POSES__;
  const CONFIG = __CONFIG__;
  const DEMO = __DEMO__;
  const params = new URLSearchParams(location.search);
  const FORCE = params.get('force');          // ?force=off: always black, ?force=on: ignore display_hours
  const ROWS = Object.keys(POSES).length;
  const READ_TOOLS = ['Read', 'Grep', 'Glob', 'Web', 'NotebookRead', 'search', 'find'];
  const JUMP_SEC = 4;
  const $ = id => document.getElementById(id);

  const TEXT = {
    'zh-TW': { offline: '離線', run: '執行中', wait: '等你', done: '完成', approve: '核准 ', question: '有問題問你',
               interrupted: '已中斷', needs: '需要你', thinking: '思考中…', now: '剛剛', min: n => `${n} 分前`,
               hour: n => `${n} 小時前`, day: n => `${n} 天前`, rainAt: h => `☔ ${h} 點會下雨`,
               umbrella: '☔ 記得帶傘', noServer: '連不到伺服器', demo: '示範資料' },
    en:      { offline: 'Offline', run: 'Running', wait: 'Waiting', done: 'Done', approve: 'Approve ',
               question: 'Has a question', interrupted: 'Interrupted', needs: 'Needs you', thinking: 'Thinking…',
               now: 'just now', min: n => `${n} min ago`, hour: n => `${n} h ago`, day: n => `${n} d ago`,
               rainAt: h => `☔ Rain at ${h}:00`, umbrella: '☔ Take an umbrella', noServer: 'Server not reachable',
               demo: 'demo data' },
  };
  const T = TEXT[CONFIG.lang] ?? TEXT.en;
  document.documentElement.lang = CONFIG.lang;
  const fmtTime = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  const fmtDate = new Intl.DateTimeFormat(CONFIG.lang, { month: 'numeric', day: 'numeric', weekday: 'short' });
  const fmtHour = new Intl.DateTimeFormat(CONFIG.lang, { hour: 'numeric', hourCycle: 'h23' });
  const WEATHER = { sun: '☀️', moon: '🌙', partly: '⛅', cloud: '☁️', fog: '🌫️', rain: '🌧️', thunder: '⛈️' };

  let status = null;
  let offset = 0;              // server clock - browser clock (seconds)
  let frame = 0;

  document.body.classList.toggle('no-wx', !CONFIG.weather);
  document.querySelectorAll('.pet').forEach(el => {
    el.style.backgroundImage = `url("${SPRITE}")`;
    el.style.backgroundSize = `800% ${ROWS * 100}%`;
  });

  function ago(sec) {
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return T.now;
    if (sec < 3600) return T.min(Math.floor(sec / 60));
    if (sec < 86400) return T.hour(Math.floor(sec / 3600));
    return T.day(Math.floor(sec / 86400));
  }

  function agentView(a, now) {
    const stale = !a || !a.state || a.state === 'OFF' || now - a.at > (status?.agent_stale_sec ?? 10800);
    if (stale) return { cls: 'off', state: T.offline, act: '', pose: 'idle' };
    const act = a.act || '';
    if (a.state === 'WAIT') {
      const text = act.startsWith('approve ') ? T.approve + act.slice(8)
                 : act === 'question' ? T.question : act === 'interrupted' ? T.interrupted
                 : act === 'needs you' ? T.needs : act;
      return { cls: 'wait', state: T.wait, act: text, pose: 'wave' };
    }
    if (a.state === 'DONE') {
      return { cls: 'done', state: T.done, act: ago(now - a.done_at), pose: now - a.done_at < JUMP_SEC ? 'jump' : 'idle' };
    }
    const pose = act.startsWith('thinking') ? 'look'
               : READ_TOOLS.some(t => act.startsWith(t)) ? 'review' : act ? 'work' : 'think';
    return { cls: 'run', state: T.run, act: act.startsWith('thinking') ? T.thinking : act, pose };
  }

  function drawPet(el, pose, f) {
    const p = POSES[pose];
    const col = pose === 'idle' && el.closest('.off') ? 3 : f % p.count;   // offline: hold the eyes-closed frame
    el.style.backgroundPosition = `${col / 7 * 100}% ${p.row / (ROWS - 1) * 100}%`;
  }

  function renderAgents(now) {
    for (const [key, id] of [['CLAUDE', 'claude'], ['CODEX', 'codex']]) {
      const card = $(id);
      const v = agentView(status?.agents?.[key], now);
      card.className = `card agent s-${v.cls}` + (v.cls === 'off' ? ' off' : '');
      card.querySelector('.state').textContent = v.state;
      card.querySelector('.act').textContent = v.act;
      drawPet(card.querySelector('.pet'), v.pose, frame);
    }
  }

  // Build elements with textContent only: data from /status never becomes HTML
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    e.textContent = text;
    return e;
  }

  function renderWeather() {
    const w = status?.weather;
    $('wIcon').textContent = WEATHER[w?.icon] ?? '';
    $('wTemp').textContent = w ? `${w.temp}°` : '—';
    $('wRain').replaceChildren(...(w ? [el('span', 'drop', '☂'), String(w.rain), el('small', '', '%')] : []));
    $('rainAlert').textContent = !w ? '' : w.rain >= w.alert_pct ? T.umbrella
      : w.alert != null ? T.rainAt(new Date(w.alert * 1000).getHours()) : '';
    const hours = (w?.hourly ?? []).slice(1, 4);   // the current hour is the big number above
    const key = JSON.stringify(hours);
    if ($('hours').dataset.key !== key) {
      $('hours').dataset.key = key;
      $('hours').replaceChildren(...hours.map(([t, p, mm]) => {
        const cell = el('div', p >= w.alert_pct && mm >= w.alert_mm ? 'wet' : '', fmtHour.format(t * 1000));
        cell.append(el('b', 'num', `${p}%`));
        return cell;
      }));
    }
  }

  function tick() {
    const now = Date.now() / 1000 + offset;
    // Black out only on a definite display_on=false; when the server is unreachable, show the error instead
    const asleep = FORCE === 'off' || (FORCE !== 'on' && status?.display_on === false);
    document.body.classList.toggle('sleep', asleep);
    if (asleep) return;              // keep the frame still
    const hms = fmtTime.format(now * 1000);
    $('clock').innerHTML = `${hms.slice(0, 5)}<span class="sec">:${hms.slice(6, 8)}</span>`;
    $('sub').textContent = status ? fmtDate.format(now * 1000) : T.noServer;
    $('sub').className = status ? '' : 'alarm';
    renderWeather();
    renderAgents(now);
    frame++;
  }

  async function refresh() {
    try {
      const t0 = Date.now();
      const r = await fetch('/status', { cache: 'no-store', signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error(r.status);
      status = await r.json();
      offset = status.now - (t0 + Date.now()) / 2000;
    } catch {
      status = null;
    }
    setTimeout(refresh, 2000);
  }

  function demoStatus(scene) {
    const t = Date.now() / 1000;
    const h0 = t - t % 3600;
    const s = { now: t, display_on: true, agent_stale_sec: 10800, active: 'CODEX',
                weather: { temp: 23, icon: 'partly', rain: 10, alert: null, alert_pct: 60, alert_mm: 0.1,
                           hourly: [[h0, 10, 0], [h0 + 3600, 35, 0], [h0 + 7200, 75, 0.6], [h0 + 10800, 80, 1.4]] },
                agents: { CLAUDE: { state: 'RUN', act: 'Edit index.html', at: t - 4, done_at: t - 900 },
                          CODEX: { state: 'WAIT', act: 'approve Bash', at: t - 12, done_at: t - 3000 } } };
    if (scene === 'alert') s.weather.alert = h0 + 7200;
    if (scene === 'done') Object.assign(s, {
      agents: { CLAUDE: { state: 'DONE', act: 'Edit README.md', at: t - 200, done_at: t - 200 },
                CODEX: { state: 'OFF', act: '', at: t - 7200, done_at: 0 } },
      weather: { temp: 18, icon: 'rain', rain: 80, alert: null, alert_pct: 60, alert_mm: 0.1,
                 hourly: [[h0, 80, 2], [h0 + 3600, 70, 1], [h0 + 7200, 40, 0], [h0 + 10800, 20, 0]] } });
    if (scene === 'think') s.agents = { CLAUDE: { state: 'RUN', act: 'thinking...', at: t - 2, done_at: 0 },
                                       CODEX: { state: 'RUN', act: 'Read server.py', at: t - 1, done_at: 0 } };
    if (scene === 'night') s.display_on = false;
    return s;
  }

  setInterval(tick, 170);
  if (DEMO) {
    status = demoStatus(params.get('scene'));
    $('demo').textContent = T.demo;
  } else refresh();
  tick();
</script>
</body>
</html>
